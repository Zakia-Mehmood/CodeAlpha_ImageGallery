<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Image Gallery</h1>

  <div class="buttons">
    <button onclick="filterGallery('mountain')">Mountains</button>
    <button onclick="filterGallery('animal')">Animals</button>
    <button onclick="filterGallery('music')">Music</button>
    <button onclick="filterGallery('flowers')">Flowers</button>
    <button onclick="filterGallery('cities')">Cities</button>
    <button onclick="filterGallery('all')">Show All</button>
    <button onclick="toggleTheme()">Toggle Theme</button>
  </div>

  <h2>Mountains</h2>
  <div class="gallery mountain">
    <img src="mountain1.jpg" alt="Mountain 1">
    <img src="mountain2.jpg" alt="Mountain 2">
    <img src="mountain3.jpg" alt="Mountain 3">
    <img src="mountain4.jpg" alt="Mountain 4">
  </div>

  <h2>Animals</h2>
  <div class="gallery animal">
    <img src="animal1.jpg" alt="Animal 1">
    <img src="animal2.jpg" alt="Animal 2">
    <img src="animal3.jpg" alt="Animal 3">
    <img src="animal4.jpg" alt="Animal 4">
  </div>

  <h2>Music</h2>
  <div class="gallery music">
    <img src="music1.jpg" alt="Music 1">
    <img src="music2.jpg" alt="Music 2">
    <img src="music3.jpg" alt="Music 3">
    <img src="music4.jpg" alt="Music 4">
  </div>

  <h2>Flowers</h2>
<div class="gallery flowers">
  <img src="flowers1.jpg" alt="Flowers 1">
  <img src="flowers2.jpg" alt="Flowers 2">
  <img src="flowers3.jpg" alt="Flowers 3">
  <img src="flowers4.jpg" alt="Flowers 4">
</div>

<h2>Cities</h2>
<div class="gallery cities">
  <img src="city1.jpg" alt="City 1">
  <img src="city2.jpg" alt="City 2">
  <img src="city3.jpg" alt="City 3">
  <img src="city4.jpg" alt="City 4">
</div>

  <div id="lightbox"></div>

  <script src="javascript.js"></script>
</body>
</html>
